%YAML 1.2
---
title: "GameBub - Vibration pulse (bounded)"
type: apps
description: "Standalone MicroBlaze V GameBub example; building never runs hardware. Deliberately running this ELF actuates the board for a bounded interval."
supported_processors:
  - microblaze_riscv
supported_os:
  - standalone
depends_libs:
  xiltimer: {}
depends:
  gpio:
    - reg
    - xlnx,gpio-width
    - xlnx,all-outputs
required_mem:
  bram:
    size: 0x4000
linker_constraints:
  heap: 0x0
  stack: 0x800
...
