# SPDX-License-Identifier: CERN-OHL-S-2.0
# Vitis SDT binding: ordered required properties populate the driver's config.
# reg supplies the control base; analog DAC setup still belongs to the ESP32.
# Importable example names/dependencies below must match files in ../examples.
# License details: LICENSE.md at repository root.
%YAML 1.2
---
title: GameBub bounded DSP DAC tone generator
type: driver
properties:
  compatible:
    OneOf:
      - items:
          - enum:
              - xlnx,gamebub-dac-audio-1.3
  reg:
    description: CPU AXI4-Lite register base and aperture
config:
  - GBAudio_Config
required:
  - compatible
  - reg
examples:
  audio_tone.c:
    - reg
  audio_safety.c:
    - reg
...
