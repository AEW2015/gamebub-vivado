name: GameBub SDK and documentation
on:
  pull_request:
    paths: ['docs/vivado/**', 'fpga/sw_repo/**', 'fpga/vivado/gamebub_ipi_demo/**', '.github/workflows/gamebub-sdk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r fpga/sw_repo/requirements-docs.txt
      - name: Host MMIO and metadata tests
        run: |
          python fpga/sw_repo/tests/run_host.py --output-dir "$RUNNER_TEMP/host-results"
          python -m unittest discover -s fpga/sw_repo/tests -p 'test_*.py'
          python fpga/sw_repo/tools/test_memory_regions.py
          python fpga/sw_repo/tools/generate_docs.py --check
          python fpga/sw_repo/tools/catalog_docs.py --check
          python fpga/sw_repo/tests/check_docs.py
      - name: Download pinned portable Doxygen
        run: |
          curl --fail --location --output "$RUNNER_TEMP/doxygen.tgz" https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz
          echo "14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  $RUNNER_TEMP/doxygen.tgz" | sha256sum --check
          mkdir "$RUNNER_TEMP/doxygen"
          tar -xzf "$RUNNER_TEMP/doxygen.tgz" --strip-components=1 -C "$RUNNER_TEMP/doxygen"
      - name: Build offline guide and API HTML
        run: python fpga/sw_repo/tools/generate_docs.py --html "$RUNNER_TEMP/guide" --doxygen "$RUNNER_TEMP/doxygen/bin/doxygen"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gamebub-guide-and-api
          path: ${{ runner.temp }}/guide
          if-no-files-found: error
